#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(248,238,228,.55),rgba(248,238,228,.35) 45%,rgba(248,238,228,.6))}
header{padding:20px 16px 18px;text-align:center}
h1{color:var(--accent);text-shadow:0 1px 8px rgba(255,248,242,.9);font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(26px,6vw,40px);margin:0}
.sub{color:var(--ink);text-shadow:0 1px 6px rgba(255,248,242,.9);font-size:13px;margin-top:4px}
.tools{display:flex;gap:8px;justify-content:center;padding:8px 16px 12px}
.tools button{border:1px solid var(--border);background:var(--card);color:var(--accent);border-radius:999px;padding:6px 14px;font-size:15px;cursor:pointer}
#wrap{overflow:auto;padding:16px;display:flex;justify-content:safe center;align-items:flex-start;min-height:60vh;-webkit-overflow-scrolling:touch}
#tree{position:relative;transform-origin:0 0;flex:none}
svg{position:absolute;inset:0;overflow:visible;pointer-events:none}
.card{position:absolute;background:var(--card);border:1.5px solid var(--border);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:12px;padding:10px 12px;cursor:pointer;
  box-shadow:0 4px 14px rgba(160,90,100,.14);transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .n{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:18px;line-height:1.1}
.card .a{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:16px;color:var(--rose)}
.card .d{font-size:11.5px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card{overflow:hidden}
.card.dead{border-style:dashed;border-color:var(--dead)}
.card.me{background:var(--hl);border-color:var(--rose);border-width:2px}
.card .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--rose)}
#sheet{position:fixed;inset:auto 0 0 0;background:#fffaf7;border-top:2px solid var(--border);border-radius:18px 18px 0 0;
  padding:20px 18px 28px;max-height:75vh;overflow:auto;transform:translateY(105%);transition:transform .25s;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
#sheet.open{transform:none}
#sheet h2{font-family:"Cormorant Garamond",serif;margin:0 0 8px;font-size:26px}
#sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
#sheet dt{color:var(--muted)}
#sheet .notes{white-space:pre-wrap;margin-top:14px;padding:12px;background:var(--hl);border-radius:10px;font-size:14px;line-height:1.5}
#sheet .x{position:absolute;top:12px;right:14px;border:0;background:none;font-size:26px;color:var(--muted);cursor:pointer}
.link{color:var(--rose);cursor:pointer;text-decoration:underline}
#msg{text-align:center;color:var(--muted);padding:30px}

.card .rel{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--rose);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.card:focus-visible,.btn:focus-visible,.link:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
#scrim{position:fixed;inset:0;background:rgba(61,42,34,.18);z-index:4}
#sheet{z-index:5;max-height:88vh;left:0;right:0;margin:0 auto;width:min(620px,100%)}
#sheet h3{font-family:"Cormorant Garamond",serif;font-size:20px;margin:18px 0 6px;color:var(--accent)}
#sheet dd{margin:0}
#sheet .empty{color:var(--muted);font-size:14px;margin:0}
.link{background:none;border:0;padding:0;font:inherit}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{font:500 14px Inter,system-ui,sans-serif;border:1px solid var(--border);background:#fffaf7;color:var(--accent);border-radius:999px;padding:8px 16px;cursor:pointer}
.btn.primary{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.danger{color:#a3354b;border-color:#e8b3bd;margin-left:auto}
.btn:disabled{opacity:.6;cursor:default}
header .add{margin-top:12px}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{font:15px Inter,system-ui,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--border);border-radius:10px;padding:9px 11px;width:100%}
.form textarea{resize:vertical;line-height:1.5}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--rose);outline-offset:0;border-color:var(--rose)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.two{grid-template-columns:1fr}}
fieldset{border:1px solid var(--border);border-radius:10px;padding:8px 12px 10px;margin:0}
legend{font-size:13px;color:var(--muted);padding:0 4px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;max-height:150px;overflow:auto}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.form label.chk input{width:auto}
.err{color:#a3354b;font-size:14px;margin:0}
.lock{position:fixed;right:16px;bottom:16px;z-index:3;font-size:13px;padding:6px 14px;background:rgba(255,250,247,.85)}
.zoom{position:fixed;left:16px;bottom:16px;z-index:3;display:flex;flex-direction:column;gap:8px}
.zb{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(255,250,247,.92);color:var(--accent);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(160,90,100,.16)}
.zb svg{position:static;inset:auto;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.zb:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
#wrap{cursor:grab;scrollbar-width:none;-ms-overflow-style:none}
#wrap::-webkit-scrollbar{display:none}
#wrap.dragging,#wrap.dragging .card{cursor:grabbing;user-select:none}
@media (prefers-reduced-motion:reduce){#sheet,.card{transition:none}}

<body>
<div id="bg"></div>
<header>
  <h1 id="title">Árbol Familiar de Flor</h1>
  <button id="addBtn" class="btn primary add" data-act="add" hidden>+ Agregar persona</button>
</header>
<div id="wrap"><div id="msg">Cargando…</div><div id="tree"></div></div>
<button id="lockBtn" class="btn lock">Editar</button>
<div class="zoom" role="group" aria-label="Zoom">
  <button class="zb" id="zIn" aria-label="Acercar"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg></button>
  <button class="zb" id="zOut" aria-label="Alejar"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg></button>
</div>
<div id="scrim" hidden></div>
<div id="sheet" role="dialog" aria-label="Ficha"><button class="x" onclick="closeSheet()" aria-label="Cerrar">×</button><div id="sheetBody"></div></div>

<script>
const W=176, H=118, GX=28, GY=96, PAD=20;
const COL='personas';
let people=[], byId={}, scale=1, db=null, canWrite=false, openId=null;

const ESTADOS=['','Soltero/a','Casado/a','En pareja','Separado/a','Divorciado/a','Viudo/a'];
const PARENTESCOS=['Yo','Madre','Padre','Hermano/a','Medio hermano/a','Abuela materna','Abuelo materno','Abuela paterna','Abuelo paterno',
 'Bisabuela','Bisabuelo','Tía materna','Tío materno','Tía paterna','Tío paterno','Tío/a político/a','Primo/a materno/a','Primo/a paterno/a',
 'Pareja','Ex pareja','Hijo/a','Sobrino/a','Pareja de un familiar'];

const listOf=v=>Array.isArray(v)?v:(v?String(v).split(/[;,]/).map(s=>s.trim()).filter(Boolean):[]);
function partnersOf(p){
  const s=new Set(listOf(p.parejas).filter(id=>byId[id]));
  people.forEach(q=>{ if(listOf(q.parejas).includes(p.id)) s.add(q.id) });
  s.delete(p.id); return [...s];
}
const parentsOf=p=>[p.padre_id,p.madre_id].filter(id=>id&&byId[id]);
const childrenOf=p=>people.filter(c=>c.padre_id===p.id||c.madre_id===p.id);
const fullName=p=>`${p.nombre||''} ${p.apellidos||''}`.trim()||'Sin nombre';
const isDead=p=>p.fallecimiento && p.fallecimiento!=='-';
const years=p=>[p.nacimiento, isDead(p)&&('† '+p.fallecimiento)].filter(Boolean).join(' – ');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function generations(){
  const gen={}; people.forEach(p=>gen[p.id]=0);
  for(let n=0;n<60;n++){
    let ch=false;
    for(const p of people){
      for(const pid of parentsOf(p)) if(gen[p.id]<=gen[pid]){gen[p.id]=gen[pid]+1;ch=true}
      for(const q of partnersOf(p)) if(gen[q]!==gen[p.id]){const m=Math.max(gen[q],gen[p.id]);gen[q]=gen[p.id]=m;ch=true}
    }
    if(!ch) break;
  }
  return gen;
}

function layout(){
  const gen=generations(), pos={}, byLevel={};
  const levels=[...new Set(Object.values(gen))].sort((a,b)=>a-b);
  for(const L of levels){
    const row=people.filter(p=>gen[p.id]===L), seen=new Set(), units=[];
    for(const p of row){ // agrupar parejas en una misma unidad
      if(seen.has(p.id)) continue;
      const u=[], st=[p];
      while(st.length){const x=st.pop(); if(seen.has(x.id)) continue; seen.add(x.id); u.push(x);
        partnersOf(x).forEach(id=>{if(gen[id]===L) st.push(byId[id])})}
      u.sort((a,b)=>a._i-b._i); units.push(u);
    }
    units.forEach(u=>{
      const xs=u.flatMap(parentsOf).filter(id=>pos[id]).map(id=>pos[id].x+W/2);
      u._c = xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null;
      u._k = u._c ?? 1e9+u[0]._i;
    });
    units.sort((a,b)=>a._k-b._k); byLevel[L]=units;
    let cur=PAD;
    for(const u of units){
      const uw=u.length*W+(u.length-1)*GX;
      if(u._c!=null) cur=Math.max(cur,u._c-uw/2);
      u.forEach(p=>{pos[p.id]={x:cur,y:PAD+L*(H+GY)};cur+=W+GX});
      cur+=GX;
    }
  }
  // pasada inversa: centrar a los padres sobre sus hijos
  for(const L of levels.slice(0,-1).reverse()){
    const units=byLevel[L]; let cur=PAD;
    for(const u of units){
      const uw=u.length*W+(u.length-1)*GX;
      const kids=u.flatMap(childrenOf).map(c=>pos[c.id].x+W/2);
      let x=pos[u[0].id].x;
      if(kids.length) x=(Math.min(...kids)+Math.max(...kids))/2-uw/2;
      x=Math.max(cur,x);
      u.forEach((p,i)=>pos[p.id].x=x+i*(W+GX));
      cur=x+uw+GX*2;
    }
  }
  const minX=Math.min(...Object.values(pos).map(p=>p.x));
  Object.values(pos).forEach(p=>p.x+=PAD-minX);
  return pos;
}

function render(){
  const tree=document.getElementById('tree'); tree.innerHTML='';
  
  const pos=layout();
  const maxX=Math.max(...Object.values(pos).map(p=>p.x))+W+PAD;
  const maxY=Math.max(...Object.values(pos).map(p=>p.y))+H+PAD;
  tree.style.width=maxX+'px'; tree.style.height=maxY+'px'; tree.dataset.w=maxX; tree.dataset.h=maxY;

  const ns='http://www.w3.org/2000/svg', svg=document.createElementNS(ns,'svg');
  svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);
  const line=(x1,y1,x2,y2,dash)=>{const l=document.createElementNS(ns,'line');
    Object.entries({x1,y1,x2,y2,stroke:'var(--line)','stroke-width':2,'stroke-linecap':'round'}).forEach(([k,v])=>l.setAttribute(k,v));
    if(dash) l.setAttribute('stroke-dasharray','5 4'); svg.appendChild(l)};

  // líneas de pareja
  const drawn=new Set();
  people.forEach(p=>partnersOf(p).forEach(q=>{
    const k=[p.id,q].sort().join('|'); if(drawn.has(k)) return; drawn.add(k);
    const a=pos[p.id], b=pos[q]; if(a.y!==b.y) return;
    const [l,r]=a.x<b.x?[a,b]:[b,a]; line(l.x+W,l.y+H/2,r.x,r.y+H/2);
  }));
  // líneas padres → hijos
  const groups={};
  people.forEach(c=>{const ps=parentsOf(c); if(!ps.length) return; const k=ps.slice().sort().join('|'); (groups[k]=groups[k]||[]).push(c)});
  const busCount={};
  Object.entries(groups).forEach(([k,kids])=>{
    const ps=k.split('|').map(id=>pos[id]);
    let ax, ay;
    if(ps.length===2 && ps[0].y===ps[1].y){ ax=(ps[0].x+ps[1].x+W)/2; ay=ps[0].y+H/2 }
    else { ax=ps[0].x+W/2; ay=ps[0].y+H }
    const cy=pos[kids[0].id].y, n=busCount[cy]=(busCount[cy]||0)+1, bus=cy-GY/2+(n%2?-1:1)*Math.floor(n/2)*14;
    line(ax,ay,ax,bus);
    const xs=kids.map(c=>pos[c.id].x+W/2).concat(ax);
    line(Math.min(...xs),bus,Math.max(...xs),bus);
    kids.forEach(c=>line(pos[c.id].x+W/2,bus,pos[c.id].x+W/2,pos[c.id].y));
  });
  tree.appendChild(svg);

  people.forEach(p=>{
    const d=document.createElement('div'), P=pos[p.id];
    d.className='card'+(isDead(p)?' dead':'')+(p.yo?' me':'');
    d.style.cssText=`left:${P.x}px;top:${P.y}px;width:${W}px;height:${H}px`;
    d.tabIndex=0; d.setAttribute('role','button');
    d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSheet(p.id)}};
    d.innerHTML=`${p.historia?'<span class="dot" title="Tiene historia"></span>':''}
      ${p.parentesco?`<div class="rel">${esc(p.parentesco)}</div>`:''}
      <div class="n">${esc(p.nombre||p.apellidos||'Sin nombre')}</div><div class="a">${esc(p.nombre?p.apellidos:'')}</div>
      <div class="d">${esc(years(p))}</div>`;
    d.onclick=()=>openSheet(p.id);
    tree.appendChild(d);
  });
  fit();
  const me=people.find(p=>p.yo), wrap=document.getElementById('wrap');
  if(me) wrap.scrollLeft=(pos[me.id].x+W/2)*scale-wrap.clientWidth/2;
}



function names(ids){return ids.map(id=>`<button class="link" data-go="${esc(id)}">${esc(fullName(byId[id]))}</button>`).join(', ')}

/* ---------- ficha ---------- */
function openSheet(id){
  const p=byId[id]; if(!p) return; openId=id;
  const rows=[
    ['Parentesco',esc(p.parentesco)],
    ['Nacimiento',esc([p.nacimiento,p.ciudad].filter(Boolean).join(' · '))],
    ['Fallecimiento',isDead(p)?esc(p.fallecimiento):''],
    ['Estado civil',esc(p.estado_civil)],
    ['Padres',names(parentsOf(p))],
    ['Pareja/s',names(partnersOf(p))],
    ['Hijos/as',names(childrenOf(p).map(c=>c.id))],
  ].filter(r=>r[1]);
  body(`<h2>${esc(fullName(p))}</h2>
    <dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <h3>Historia</h3>
    ${p.historia?`<div class="notes">${esc(p.historia)}</div>`:`<p class="empty">${canWrite?'Todavía no escribiste su historia. Tocá Editar para agregarla.':'Sin historia cargada.'}</p>`}
    ${canWrite?`<div class="actions">
      <button class="btn primary" data-act="edit">Editar</button>
      <button class="btn" data-act="child">Agregar hijo/a</button>
      <button class="btn" data-act="partner">Agregar pareja</button>
    </div>`:''}`);
}
function body(html){
  document.getElementById('sheetBody').innerHTML=html;
  const s=document.getElementById('sheet'); s.classList.add('open'); s.scrollTop=0;
  document.getElementById('scrim').hidden=false;
}
function closeSheet(){document.getElementById('sheet').classList.remove('open');document.getElementById('scrim').hidden=true;openId=null}

/* ---------- formulario ---------- */
function opts(sel,exclude){
  return '<option value="">—</option>'+people.filter(q=>q.id!==exclude).slice().sort((a,b)=>fullName(a).localeCompare(fullName(b)))
    .map(q=>`<option value="${esc(q.id)}"${q.id===sel?' selected':''}>${esc(fullName(q))}</option>`).join('');
}
function openForm(id,preset={}){
  const p=id?byId[id]:{...preset}; const self=id||'';
  const myPartners=id?partnersOf(p):listOf(p.parejas);
  body(`<h2>${id?'Editar a '+esc(fullName(p)):'Nueva persona'}</h2>
  <form id="f" class="form" novalidate>
    <label>Nombre/s<input id="f-nombre" value="${esc(p.nombre)}" autocomplete="off"></label>
    <label>Apellido/s<input id="f-apellidos" value="${esc(p.apellidos)}" autocomplete="off"></label>
    <div class="two">
      <label>Año de nacimiento<input id="f-nac" inputmode="numeric" maxlength="4" placeholder="ej. 1950" value="${esc(p.nacimiento)}"></label>
      <label>Año de fallecimiento<input id="f-fal" inputmode="numeric" maxlength="4" placeholder="-" value="${esc(p.fallecimiento==='-'?'':p.fallecimiento)}"></label>
    </div>
    <label>Ciudad de nacimiento<input id="f-ciudad" value="${esc(p.ciudad)}"></label>
    <div class="two">
      <label>Estado civil<select id="f-estado">${ESTADOS.map(e=>`<option${e===(p.estado_civil||'')?' selected':''}>${e}</option>`).join('')}</select></label>
      <label>Parentesco (con vos)<input id="f-par" list="dl-par" value="${esc(p.parentesco)}"></label>
    </div>
    <datalist id="dl-par">${PARENTESCOS.map(x=>`<option value="${x}">`).join('')}</datalist>
    <div class="two">
      <label>Padre<select id="f-padre">${opts(p.padre_id,self)}</select></label>
      <label>Madre<select id="f-madre">${opts(p.madre_id,self)}</select></label>
    </div>
    <fieldset><legend>Pareja/s</legend><div class="checks">
      ${people.filter(q=>q.id!==self).sort((a,b)=>fullName(a).localeCompare(fullName(b))).map(q=>
        `<label class="chk"><input type="checkbox" value="${esc(q.id)}"${myPartners.includes(q.id)?' checked':''}>${esc(fullName(q))}</label>`).join('')}
    </div></fieldset>
    <label>Historia<textarea id="f-hist" rows="6" placeholder="Lo que sabés de su vida: hechos importantes, mudanzas, pérdidas, secretos, enfermedades, oficios…">${esc(p.historia)}</textarea></label>
    <p id="f-err" class="err" hidden></p>
    <div class="actions">
      <button class="btn primary" type="submit">Guardar</button>
      <button class="btn" type="button" data-act="${id?'back':'close'}">Cancelar</button>
      ${id?'<button class="btn danger" type="button" data-act="del">Eliminar</button>':''}
    </div>
  </form>`);
  const f=document.getElementById('f');
  f.onsubmit=e=>{e.preventDefault();save(id,p)};
  document.getElementById('f-nombre').focus({preventScroll:true});
}
async function save(id,prev){
  const v=x=>document.getElementById(x).value.trim();
  const err=document.getElementById('f-err'); err.hidden=true;
  const nac=v('f-nac'), fal=v('f-fal');
  if(!v('f-nombre')&&!v('f-apellidos')){err.textContent='Escribí al menos un nombre o un apellido.';err.hidden=false;return}
  if((nac&&!/^\d{4}$/.test(nac))||(fal&&!/^\d{4}$/.test(fal))){err.textContent='Los años van con 4 números, por ejemplo 1950. Si sigue con vida, dejá el fallecimiento vacío.';err.hidden=false;return}
  const parejas=[...document.querySelectorAll('.checks input:checked')].map(i=>i.value);
  const docId=id||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
  const data={
    nombre:v('f-nombre'), apellidos:v('f-apellidos'), nacimiento:nac, fallecimiento:fal||'-',
    ciudad:v('f-ciudad'), estado_civil:v('f-estado'), parentesco:v('f-par'),
    padre:v('f-padre'), madre:v('f-madre'), parejas, historia:document.getElementById('f-hist').value.trim(),
    yo:!!(prev&&prev.yo), orden: prev&&prev.orden!=null ? prev.orden : (Math.max(0,...people.map(q=>q.orden||0))+1)
  };
  const btn=document.querySelector('#f [type=submit]'); btn.disabled=true; btn.textContent='Guardando…';
  try{
    // si se desmarcó una pareja que la tenía anotada a ella, se limpia del otro lado
    if(id){
      for(const q of people){ const l=listOf(q.parejas);
        if(l.includes(id)&&!parejas.includes(q.id)) await db.doc(COL+'/'+q.id).update({parejas:l.filter(x=>x!==id)}) }
    }
    await db.doc(COL+'/'+docId).set(data);
    pendingOpen=docId;
  }catch(e){ btn.disabled=false; btn.textContent='Guardar';
    err.textContent=e&&e.code==='invalid_argument'?'No tenés permiso para editar este árbol.':'No se pudo guardar. Probá de nuevo en un momento.'; err.hidden=false }
}
let pendingOpen=null, delArmed=false;
async function del(id){
  const b=document.querySelector('[data-act=del]');
  if(!delArmed){delArmed=true;b.textContent='¿Seguro? Tocá otra vez';setTimeout(()=>{delArmed=false;if(b.isConnected)b.textContent='Eliminar'},4000);return}
  delArmed=false; b.disabled=true;
  try{
    for(const q of people){ const l=listOf(q.parejas); const up={};
      if(l.includes(id)) up.parejas=l.filter(x=>x!==id);
      if(q.padre_id===id) up.padre=''; if(q.madre_id===id) up.madre='';
      if(Object.keys(up).length) await db.doc(COL+'/'+q.id).update(up) }
    await db.doc(COL+'/'+id).delete(); closeSheet();
  }catch(e){ b.disabled=false; b.textContent='Eliminar'; const er=document.getElementById('f-err'); er.textContent='No se pudo eliminar.'; er.hidden=false }
}

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]'); if(go){openSheet(go.dataset.go);return}
  const a=e.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, p=byId[openId];
  if(act==='edit') openForm(openId);
  else if(act==='back') openSheet(openId);
  else if(act==='close') closeSheet();
  else if(act==='del') del(openId);
  else if(act==='add') {openId=null; openForm(null,{})}
  else if(act==='child'){ const pr=partnersOf(p)[0]; const fem=/madre|abuela|tía|hermana|prima|esposa/i.test(p.parentesco||'');
    const preset=fem?{madre_id:p.id,padre_id:pr||''}:{padre_id:p.id,madre_id:pr||''}; openForm(null,preset) }
  else if(act==='partner') openForm(null,{parejas:[p.id]});
});
document.getElementById('scrim').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

/* ---------- zoom automático ---------- */
function setScale(s){scale=s; const t=document.getElementById('tree');
  t.style.transform=`scale(${scale})`; t.style.marginBottom=`${(scale-1)*t.dataset.h}px`; t.style.marginRight=`${(scale-1)*t.dataset.w}px`}
function fit(){const t=document.getElementById('tree'), avail=document.getElementById('wrap').clientWidth-32;
  setScale(Math.max(innerWidth>=900?.75:.7,Math.min(1,avail/t.dataset.w)))}
let lastW=innerWidth;
window.addEventListener('resize',()=>{if(people.length&&innerWidth!==lastW){lastW=innerWidth;fit()}});
function zoomTo(s){
  const w=document.getElementById('wrap'), old=scale;
  s=Math.max(.3,Math.min(1.8,s)); if(s===old) return;
  const cx=(w.scrollLeft+w.clientWidth/2)/old, cy=(scrollY+innerHeight/2-w.offsetTop)/old;
  setScale(s);
  w.scrollLeft=cx*s-w.clientWidth/2; scrollTo(scrollX,cy*s+w.offsetTop-innerHeight/2);
}
document.getElementById('zIn').onclick=()=>zoomTo(scale*1.25);
document.getElementById('zOut').onclick=()=>zoomTo(scale/1.25);
document.getElementById('wrap').addEventListener('wheel',e=>{if(e.ctrlKey){e.preventDefault();zoomTo(scale*(e.deltaY<0?1.1:1/1.1))}},{passive:false});
/* arrastrar con la manito (mouse) */
let drag=null, dragged=false;
const wrapEl=document.getElementById('wrap');
wrapEl.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='mouse'||e.button!==0) return;
  drag={x:e.clientX,y:e.clientY,sl:wrapEl.scrollLeft,sy:scrollY}; dragged=false;
});
addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!dragged&&Math.hypot(dx,dy)<5) return;
  if(!dragged){dragged=true;wrapEl.classList.add('dragging')}
  wrapEl.scrollLeft=drag.sl-dx; scrollTo(scrollX,drag.sy-dy);
});
addEventListener('pointerup',()=>{ if(!drag) return; drag=null; wrapEl.classList.remove('dragging'); setTimeout(()=>dragged=false,0) });
wrapEl.addEventListener('click',e=>{ if(dragged){e.stopPropagation();e.preventDefault()} },true);
wrapEl.addEventListener('dragstart',e=>e.preventDefault());
let pinch=null;
const tdist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
document.getElementById('wrap').addEventListener('touchstart',e=>{if(e.touches.length===2)pinch={d:tdist(e.touches),s:scale}},{passive:true});
document.getElementById('wrap').addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();zoomTo(pinch.s*tdist(e.touches)/pinch.d)}},{passive:false});
document.getElementById('wrap').addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null});

/* ---------- datos ---------- */
function msg(t){const m=document.getElementById('msg');m.textContent=t;m.hidden=!t}
function load(snap){
  people=snap.docs.map(d=>{const x=d.data();return {...x,id:d.id,padre_id:x.padre||'',madre_id:x.madre||'',_i:x.orden??0}})
    .sort((a,b)=>a._i-b._i);
  byId=Object.fromEntries(people.map(p=>[p.id,p]));
  if(!people.length){document.getElementById('tree').innerHTML='';msg(canWrite?'Todavía no hay nadie en el árbol. Tocá “Agregar persona” para empezar.':'Todavía no hay nadie en el árbol.');return}
  msg(''); render();
  if(pendingOpen&&byId[pendingOpen]){openSheet(pendingOpen);pendingOpen=null}
  else if(openId&&document.getElementById('f')==null){ byId[openId]?openSheet(openId):closeSheet() }
}
/* ===== CONFIGURACIÓN ===== */
// Pegá entre las comillas la URL de tu Apps Script (termina en /exec)
const API_URL = "https://script.google.com/macros/s/AKfycbz6GLYdBKU-VRwxXOyKUrg-PGMjSe4366_YS0zzSSfd638qATEmsS04j6hb1aryivPz-g/exec";
/* ========================= */
let clave='';
try{clave=sessionStorage.getItem('arbol-clave')||''}catch(_){}
async function api(body){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({...body,clave})});
  const j=await r.json();
  if(!j.ok) throw {code:j.error==='clave'?'invalid_argument':'unavailable'};
  scheduleRefresh(); return j;
}
db={doc:path=>{const id=path.split('/')[1];return{
  set:d=>api({action:'set',id,data:d}), update:d=>api({action:'update',id,data:d}), delete:()=>api({action:'delete',id})}}};
let rt=null; function scheduleRefresh(){clearTimeout(rt);rt=setTimeout(refresh,150)}
async function refresh(){
  try{
    const r=await fetch(API_URL+'?t='+Date.now()); const j=await r.json();
    const docs=(j.personas||[]).map(p=>({id:p.id,data:()=>({...p,parejas:listOf(p.parejas),yo:/^(si|sí|true)$/i.test(p.yo||''),orden:Number(p.orden)||0})}));
    load({docs});
  }catch(_){msg('No se pudieron cargar los datos. Revisá la URL del script y recargá la página.')}
}
function setEdit(on){
  canWrite=on; document.getElementById('addBtn').hidden=!on;
  document.getElementById('lockBtn').textContent=on?'Salir de edición':'Editar';
  if(openId&&byId[openId]) openSheet(openId);
}
document.getElementById('lockBtn').onclick=()=>{
  if(canWrite){clave='';try{sessionStorage.removeItem('arbol-clave')}catch(_){};setEdit(false);return}
  openId=null;
  body(`<h2>Modo edición</h2><form id="lk" class="form">
    <label>Contraseña<input id="lk-c" type="password" autocomplete="current-password"></label>
    <p id="lk-e" class="err" hidden>Contraseña incorrecta.</p>
    <div class="actions"><button class="btn primary" type="submit">Entrar</button></div></form>`);
  const f=document.getElementById('lk'); document.getElementById('lk-c').focus();
  f.onsubmit=async e=>{e.preventDefault(); const c=document.getElementById('lk-c').value;
    const b=f.querySelector('button'); b.disabled=true; b.textContent='Comprobando…';
    try{ const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({action:'check',clave:c})}); const j=await r.json();
      if(j.ok){clave=c;try{sessionStorage.setItem('arbol-clave',c)}catch(_){};closeSheet();setEdit(true)}
      else{document.getElementById('lk-e').hidden=false;b.disabled=false;b.textContent='Entrar'}
    }catch(_){document.getElementById('lk-e').textContent='No se pudo comprobar. Revisá tu conexión.';document.getElementById('lk-e').hidden=false;b.disabled=false;b.textContent='Entrar'}
  };
};
if(!API_URL) msg('Falta pegar la URL del script en el archivo (API_URL).');
else { refresh(); if(clave) setEdit(true); }
</script>

</body>
</html>
